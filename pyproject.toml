[project]
name = "carppmv"
version = "0.1.0"
description = "Croatian PPMV tax calculator and car-import profitability tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "playwright>=1.48",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.14.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright-stealth>=1.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real DB + OPENROUTER_API_KEY (skip in CI)",
]
