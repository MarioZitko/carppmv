name: CI

on:
  pull_request:
  # Pushes to main are covered by deploy.yml, which calls this workflow as a
  # gate — listing `push` here too would just run every check twice.
  workflow_call:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check app/ tests/ scripts/

      # Integration tests need a live Postgres and an OpenRouter key, so CI
      # runs everything else — which is the whole tax engine, the scrapers'
      # parsing layer, catalogue matching and the /calculate pipeline.
      - name: Tests
        run: uv run pytest tests/ -m "not integration" -q

  frontend:
    name: Frontend (types + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
